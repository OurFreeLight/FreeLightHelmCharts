apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "botblocker.fullname" . }}
  labels:
    {{- include "botblocker.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "botblocker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "botblocker.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "botblocker.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ .Values.image.repository | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          env:
            - name: DATABASE_SERVER
              value: {{ .Values.database.server | quote }}
            - name: DATABASE_PORT
              value: {{ .Values.database.port | quote }}
            - name: DATABASE_USERNAME
              value: {{ .Values.database.username | quote }}
            - name: DATABASE_PASSWORD
              value: {{ .Values.database.password | quote }}
            - name: DATABASE_SCHEMA
              value: {{ .Values.database.schema | quote }}

            - name: AUTH_TOKEN
              value: {{ .Values.authToken | quote }}
            - name: NUM_HASHERS
              value: {{ .Values.numHashers | quote }}

            # Optional DB SSL config (keep these even when ssl.enabled=false; app can ignore them)
            - name: DATABASE_SSL_ENABLED
              value: {{ .Values.database.ssl.enabled | quote }}
            - name: DATABASE_SSL_REJECT_UNAUTHORIZED
              value: {{ .Values.database.ssl.rejectUnauthorized | quote }}
            - name: DATABASE_SSL_CA
              value: {{ default "" .Values.database.ssl.ca | quote }}
            - name: DATABASE_SSL_KEY
              value: {{ default "" .Values.database.ssl.key | quote }}
            - name: DATABASE_SSL_CERT
              value: {{ default "" .Values.database.ssl.cert | quote }}

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          {{- if not .Values.ingress.enabled }}
          livenessProbe:
            exec:
              command: ["sh","-c","ps -o pid= -C blocker_server"]
            initialDelaySeconds: 10
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            exec:
              command: ["sh","-c","ps -o pid= -C blocker_server"]
            initialDelaySeconds: 5
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          {{- else }}
          livenessProbe:
            httpGet:
              path: /v1/botblocker/health
              port: http
            initialDelaySeconds: 10
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /v1/botblocker/health
              port: http
            initialDelaySeconds: 5
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          {{- end }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}

      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
