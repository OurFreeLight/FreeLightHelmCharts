apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "freelight-dao.fullname" . }}-test-api-connection"
  labels:
    {{- include "freelight-dao.labels" (merge (dict "SelectorName" "api") .) | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "freelight-dao.fullname" . }}:80']
  restartPolicy: Never
