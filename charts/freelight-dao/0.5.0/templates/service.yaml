{{- if .Values.database.deploy -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "freelight-dao.fullname" . }}-db-service
  labels:
    {{- include "freelight-dao.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 3306
      targetPort: database
      protocol: TCP
      name: database
  selector:
    {{- include "freelight-dao.selectorLabels" . | nindent 4 }}
---
{{- end -}}
{{- if .Values.garnet.deploy -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "freelight-dao.fullname" . }}-garnet-service
  labels:
    {{- include "freelight-dao.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: garnet
      protocol: TCP
      name: garnet
  selector:
    {{- include "freelight-dao.selectorLabels" . | nindent 4 }}
---
{{- end -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "freelight-dao.fullname" . }}
  labels:
    {{- include "freelight-dao.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: api
      protocol: TCP
      name: api
  selector:
    {{- include "freelight-dao.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "freelight-dao.fullname" . }}-dicebear-service
  labels:
    {{- include "freelight-dao.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: dicebear-api
      protocol: TCP
      name: dicebear-api
  selector:
    {{- include "freelight-dao.selectorLabels" . | nindent 4 }}

