{{- if .Values.httpRoute.gateway.create }}
{{- if .Values.httpRoute.gateway.tls.certificateRefs }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.httpRoute.gateway.name }}-http-redirect
spec:
  parentRefs:
  - name: {{ .Values.httpRoute.gateway.name }}
    sectionName: http
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
{{- end }}
{{- end }}
