{{- if .Values.freelightDAO_frontend.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "freelight-dao.fullname" . }}-frontend-service
  labels:
    {{- include "freelight-dao.labels" (merge (dict "SelectorName" "frontend") .) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: frontend-http
      protocol: TCP
      name: frontend-http
  selector:
    {{- include "freelight-dao.selectorLabels" (merge (dict "SelectorName" "frontend") .) | nindent 4 }}
{{- end }}
{{- if .Values.freelightDAO_API.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "freelight-dao.fullname" . }}-api-service
  labels:
    {{- include "freelight-dao.labels" (merge (dict "SelectorName" "api") .) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 5001
      targetPort: api
      protocol: TCP
      name: api
  selector:
    {{- include "freelight-dao.selectorLabels" (merge (dict "SelectorName" "api") .) | nindent 4 }}
{{- end }}
