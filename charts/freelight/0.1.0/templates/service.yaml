apiVersion: v1
kind: Service
metadata:
  name: {{ include "freelight.fullname" . }}
  labels:
    {{- include "freelight.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 5010
      targetPort: web
      protocol: TCP
      name: web
  selector:
    {{- include "freelight.selectorLabels" . | nindent 4 }}
