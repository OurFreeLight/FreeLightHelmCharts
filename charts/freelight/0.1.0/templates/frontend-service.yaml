{{- if .Values.freelight_frontend.enabled -}}
{{- $component := "frontend" -}}
{{- $ctx := merge (dict "Component" $component) . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "freelight.componentFullname" $ctx }}
  labels:
    {{- include "freelight.componentSelectorLabels" $ctx | nindent 4 }}
    {{- include "freelight.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "freelight.componentSelectorLabels" $ctx | nindent 4 }}
{{- end }}
