{{- $fullName := include "freelight.fullname" . -}}
{{- $frontend := merge (dict "Component" "frontend") . -}}
{{- $frontendName := include "freelight.componentFullname" $frontend -}}
{{- $backend := merge (dict "Component" "backend") . -}}
{{- $backendName := include "freelight.componentFullname" $backend -}}
# User-facing route → frontend nginx (which proxies API/OIDC paths to backend)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-web
  labels:
    {{- include "freelight.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.httpRoute.gateway.name }}
      {{- if .Values.httpRoute.gateway.namespace }}
      namespace: {{ .Values.httpRoute.gateway.namespace }}
      {{- end }}
      {{- if .Values.certManager.enabled }}
      sectionName: https
      {{- end }}
  hostnames:
    {{- range .Values.freelight_frontend.httpRoute.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - backendRefs:
        - name: {{ $frontendName }}
          port: 80
{{- if and .Values.freelight_backend.apiHttpRoute .Values.freelight_backend.apiHttpRoute.hostnames }}
---
# Optional dedicated API hostname → backend SEA directly. Most apps don't
# need this since the frontend nginx proxies /v1/* to the backend on the
# main hostname; this is here for legacy clients calling api-* directly.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-api
  labels:
    {{- include "freelight.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.httpRoute.gateway.name }}
      {{- if .Values.httpRoute.gateway.namespace }}
      namespace: {{ .Values.httpRoute.gateway.namespace }}
      {{- end }}
      {{- if .Values.certManager.enabled }}
      sectionName: https
      {{- end }}
  hostnames:
    {{- range .Values.freelight_backend.apiHttpRoute.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - backendRefs:
        - name: {{ $backendName }}
          port: 5010
{{- end }}
