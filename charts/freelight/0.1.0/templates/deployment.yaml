{{- $garnetUrl := printf "redis://%s:%s" .Values.freelight_backend.garnet.server (.Values.freelight_backend.garnet.port | toString) -}}
{{- $garnetPubSubUrl := printf "redis://%s:%s" .Values.freelight_backend.garnetPubSub.server (.Values.freelight_backend.garnetPubSub.port | toString) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "freelight.fullname" . }}-backend
  labels:
    {{- include "freelight.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "freelight.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Rolling-tag builds (e.g. `0.4.0-staging`) push a new digest under the
        # same tag, so helm diff sees no change and pods never restart. Keying
        # an annotation to .Release.Revision forces a rollout on every helm
        # upgrade so each pipeline run actually replaces the running code.
        release/revision: {{ .Release.Revision | quote }}
        {{- if .Values.freelight_backend.useConfigMap }}
        checksum/frontend-config: {{ include (print $.Template.BasePath "/frontend-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "freelight.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.imageSettings.pullSecrets }}
      imagePullSecrets:
        - name: {{ .Values.imageSettings.pullSecrets }}
      {{- end }}
      serviceAccountName: {{ include "freelight.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: freelight-init
          image: busybox:1.37
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Waiting for database at {{ .Values.freelight_backend.database.server }}:{{ .Values.freelight_backend.database.port }}"
              while ! nc -z {{ .Values.freelight_backend.database.server }} {{ .Values.freelight_backend.database.port }}; do
                sleep 1
              done
              echo "Database ready"
              echo "Waiting for Garnet at {{ .Values.freelight_backend.garnet.server }}:{{ .Values.freelight_backend.garnet.port }}"
              while ! nc -z {{ .Values.freelight_backend.garnet.server }} {{ .Values.freelight_backend.garnet.port }}; do
                sleep 1
              done
              echo "Garnet ready"
      containers:
        - name: freelight-backend
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.freelight_backend.image }}"
          imagePullPolicy: {{ .Values.imageSettings.pullPolicy }}
          ports:
            - name: web
              containerPort: 5010
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: web
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: web
            initialDelaySeconds: 10
            periodSeconds: 10
          env:
            - name: SERVER_TYPE
              value: "web-api"
            - name: LOG_LEVEL
              value: {{ .Values.freelight_backend.logLevel | quote }}
            - name: HTTP_PORT
              value: "5010"
            - name: API_HTTP_PORT
              value: "5010"
            - name: BASE_URL
              value: {{ .Values.freelight_backend.baseWebUrl | quote }}
            - name: BASE_API_URL
              value: {{ .Values.freelight_backend.baseApiUrl | quote }}
            - name: JWT_SECRET_KEY
              value: {{ .Values.freelight_backend.jwtSecretKey | quote }}
            - name: AUTH_URL
              value: {{ .Values.freelight_backend.authUrl | default "" | quote }}
            - name: AUTH_JWKS_URL
              value: {{ .Values.freelight_backend.authJwksUrl | default "" | quote }}
            - name: RECAPTCHA_KEY
              value: {{ .Values.freelight_backend.recaptchaKey | quote }}
            - name: DATABASE_TYPE
              value: "postgres"
            - name: DATABASE_SERVER
              value: {{ .Values.freelight_backend.database.server | quote }}
            - name: DATABASE_PORT
              value: {{ .Values.freelight_backend.database.port | quote }}
            - name: DATABASE_USERNAME
              value: {{ .Values.freelight_backend.database.username | quote }}
            - name: DATABASE_PASSWORD
              value: {{ .Values.freelight_backend.database.password | quote }}
            - name: DATABASE_SCHEMA
              value: {{ .Values.freelight_backend.database.schema | quote }}
            {{- if .Values.freelight_backend.database.ssl.enabled }}
            - name: DATABASE_SSL_REJECT_UNAUTHORIZED
              value: "{{ ternary "1" "0" .Values.freelight_backend.database.ssl.rejectUnauthorized }}"
            - name: DATABASE_SSL_CA
              value: {{ .Values.freelight_backend.database.ssl.ca | quote }}
            - name: DATABASE_SSL_KEY
              value: {{ .Values.freelight_backend.database.ssl.key | quote }}
            - name: DATABASE_SSL_CERT
              value: {{ .Values.freelight_backend.database.ssl.cert | quote }}
            {{- end }}
            - name: GARNET_URL
              value: {{ $garnetUrl | quote }}
            - name: GARNET_TLS
              value: "{{ ternary "1" "0" .Values.freelight_backend.garnet.tls }}"
            - name: GARNET_TLS_INSECURE
              value: "{{ ternary "1" "0" .Values.freelight_backend.garnet.tlsInsecure }}"
            - name: GARNET_CLUSTER
              value: "{{ ternary "1" "0" .Values.freelight_backend.garnet.cluster }}"
            {{- if .Values.freelight_backend.garnet.username }}
            - name: GARNET_USERNAME
              value: {{ .Values.freelight_backend.garnet.username | quote }}
            {{- end }}
            {{- if .Values.freelight_backend.garnet.password }}
            - name: GARNET_PASSWORD
              value: {{ .Values.freelight_backend.garnet.password | quote }}
            {{- end }}
            - name: GARNET_PUBSUB_URL
              value: {{ $garnetPubSubUrl | quote }}
            - name: GARNET_PUBSUB_TLS
              value: "{{ ternary "1" "0" .Values.freelight_backend.garnetPubSub.tls }}"
            - name: GARNET_PUBSUB_TLS_INSECURE
              value: "{{ ternary "1" "0" .Values.freelight_backend.garnetPubSub.tlsInsecure }}"
            {{- if .Values.freelight_backend.garnetPubSub.username }}
            - name: GARNET_PUBSUB_USERNAME
              value: {{ .Values.freelight_backend.garnetPubSub.username | quote }}
            {{- end }}
            {{- if .Values.freelight_backend.garnetPubSub.password }}
            - name: GARNET_PUBSUB_PASSWORD
              value: {{ .Values.freelight_backend.garnetPubSub.password | quote }}
            {{- end }}
            {{- if .Values.freelight_backend.botBlocker.enabled }}
            - name: BOTBLOCKER_URL
              value: {{ .Values.freelight_backend.botBlocker.url | quote }}
            - name: BOTBLOCKER_AUTH_TOKEN
              value: {{ .Values.freelight_backend.botBlocker.authToken | quote }}
            {{- end }}
            - name: AWS_SES_REGION
              value: {{ .Values.freelight_backend.aws.ses.region | quote }}
            - name: AWS_ACCESS_KEY_ID
              value: {{ .Values.freelight_backend.aws.ses.accessKey | quote }}
            - name: AWS_SECRET_ACCESS_KEY
              value: {{ .Values.freelight_backend.aws.ses.secretKey | quote }}
            - name: OTEL_EXPORTER_TYPE
              value: {{ .Values.freelight_backend.openTelemetry.type | quote }}
            - name: OTEL_EXPORTER_URL
              value: {{ .Values.freelight_backend.openTelemetry.url | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.freelight_backend.openTelemetry.name | quote }}
            {{- if .Values.freelight_backend.openTelemetry.gcp.authKeySecretName }}
            - name: GCP_PROJECT_ID
              value: {{ .Values.freelight_backend.openTelemetry.gcp.projectId | quote }}
            - name: GCP_KEY_FILEPATH
              value: "/app/gcp.json"
            {{- end }}
            {{- if .Values.freelight_backend.openTelemetry.azure.connectionString }}
            - name: AZURE_APPINSIGHTS_CONNECTION_STRING
              value: {{ .Values.freelight_backend.openTelemetry.azure.connectionString | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.freelight_backend.useConfigMap .Values.freelight_backend.openTelemetry.gcp.authKeySecretName }}
          volumeMounts:
            {{- if .Values.freelight_backend.useConfigMap }}
            - name: frontend-config
              mountPath: /app/public/config.json
              subPath: config.json
              readOnly: true
            {{- end }}
            {{- if .Values.freelight_backend.openTelemetry.gcp.authKeySecretName }}
            - name: gcp-key-volume
              mountPath: /app/gcp.json
              subPath: gcp.json
            {{- end }}
          {{- end }}
      {{- if or .Values.freelight_backend.useConfigMap .Values.freelight_backend.openTelemetry.gcp.authKeySecretName }}
      volumes:
        {{- if .Values.freelight_backend.useConfigMap }}
        - name: frontend-config
          configMap:
            name: {{ include "freelight.fullname" . }}-frontend-config
            items:
              - key: config.json
                path: config.json
        {{- end }}
        {{- if .Values.freelight_backend.openTelemetry.gcp.authKeySecretName }}
        - name: gcp-key-volume
          secret:
            secretName: {{ .Values.freelight_backend.openTelemetry.gcp.authKeySecretName | quote }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
