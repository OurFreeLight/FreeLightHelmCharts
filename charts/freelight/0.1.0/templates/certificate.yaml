{{- if .Values.certManager.enabled }}
{{- $fullName := include "freelight.fullname" . }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $fullName }}-web-tls
spec:
  secretName: {{ $fullName }}-web-tls
  issuerRef:
    {{- if .Values.certManager.clusterIssuer }}
    kind: ClusterIssuer
    name: {{ .Values.certManager.clusterIssuer | quote }}
    {{- else }}
    name: {{ $fullName }}-issuer
    {{- end }}
  dnsNames:
  {{- range .Values.freelight.httpRoute.hostnames }}
    - {{ . | quote }}
  {{- end }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $fullName }}-api-tls
spec:
  secretName: {{ $fullName }}-api-tls
  issuerRef:
    {{- if .Values.certManager.clusterIssuer }}
    kind: ClusterIssuer
    name: {{ .Values.certManager.clusterIssuer | quote }}
    {{- else }}
    name: {{ $fullName }}-issuer
    {{- end }}
  dnsNames:
  {{- range .Values.freelight.apiHttpRoute.hostnames }}
    - {{ . | quote }}
  {{- end }}
{{- end -}}
