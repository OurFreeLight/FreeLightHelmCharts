{{- if .Values.freelight_frontend.enabled -}}
{{- $component := "frontend" -}}
{{- $ctx := merge (dict "Component" $component) . -}}
{{- $backend := merge (dict "Component" "backend") . -}}
{{- $backendName := include "freelight.componentFullname" $backend -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "freelight.componentFullname" $ctx }}
  labels:
    {{- include "freelight.componentSelectorLabels" $ctx | nindent 4 }}
    {{- include "freelight.labels" . | nindent 4 }}
spec:
  replicas: {{ default 1 .Values.freelight_frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "freelight.componentSelectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      annotations:
        release/revision: {{ .Release.Revision | quote }}
        {{- if .Values.freelight_frontend.useConfigMap }}
        checksum/config: {{ include (print $.Template.BasePath "/frontend-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "freelight.componentSelectorLabels" $ctx | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.imageSettings.pullSecrets }}
      imagePullSecrets:
        - name: {{ .Values.imageSettings.pullSecrets }}
      {{- end }}
      serviceAccountName: {{ include "freelight.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: freelight-frontend
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.freelight_frontend.image }}"
          imagePullPolicy: {{ .Values.imageSettings.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: ENVIRONMENT
              value: {{ default "staging" .Values.freelight_frontend.environment | quote }}
            - name: BACKEND_UPSTREAM
              value: "http://{{ $backendName }}:5010"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml (default .Values.resources .Values.freelight_frontend.resources) | nindent 12 }}
          {{- if .Values.freelight_frontend.useConfigMap }}
          volumeMounts:
            - name: frontend-config
              mountPath: /usr/share/nginx/html/config.json
              subPath: config.json
              readOnly: true
          {{- end }}
      {{- if .Values.freelight_frontend.useConfigMap }}
      volumes:
        - name: frontend-config
          configMap:
            name: {{ include "freelight.fullname" . }}-frontend-config
            items:
              - key: config.json
                path: config.json
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
