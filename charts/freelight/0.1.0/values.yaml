replicaCount: 1

imageSettings:
  pullSecrets: ""
  pullPolicy: Always

freelight_frontend:
  enabled: true
  image: harbor.higheredgesoftware.com/ourfreelight/freelight-frontend:0.4.1-staging
  environment: staging
  replicaCount: 1
  resources: {}
  useConfigMap: true
  # SPA's API base URL. Defaults to https://<first-frontend-hostname> so the
  # in-cluster nginx proxy handles /v1/* and OIDC paths transparently.
  apiUrl: ""
  authUrl: ""
  authClientId: freelight-campaign
  httpRoute:
    hostnames:
      - staging-freelight.higheredgesoftware.com

freelight_backend:
  image: harbor.higheredgesoftware.com/ourfreelight/freelight-backend:0.4.1-staging
  logLevel: verbose
  baseWebUrl: http://localhost:5010
  baseApiUrl: http://localhost:5010
  jwtSecretKey: ""
  authUrl: ""
  authJwksUrl: ""
  recaptchaKey: ""
  useConfigMap: false
  # Optional dedicated API hostname. Leave empty to use only the
  # frontend hostname (the nginx in front proxies /v1/* and OIDC paths
  # to the backend Service).
  apiHttpRoute:
    hostnames: []
  aws:
    ses:
      region: ""
      accessKey: ""
      secretKey: ""
  database:
    server: ""
    port: 5432
    username: ""
    password: ""
    schema: appdb
    ssl:
      enabled: false
      rejectUnauthorized: true
      ca: ""
      key: ""
      cert: ""
  garnet:
    server: ""
    port: 6379
    tls: false
    tlsInsecure: false
    cluster: false
    username: ""
    password: ""
  garnetPubSub:
    server: ""
    port: 6379
    tls: false
    tlsInsecure: false
    username: ""
    password: ""
  botBlocker:
    enabled: false
    url: ""
    authToken: ""
  openTelemetry:
    type: "none"
    url: ""
    name: "freelight"
    gcp:
      projectId: ""
      authKeySecretName: ""
    azure:
      connectionString: ""

certManager:
  enabled: true
  email: admin@freelight.org
  clusterIssuer: letsencrypt-prod
  solver: http01
  dns01: {}

httpRoute:
  gateway:
    name: freelight-gateway
    namespace: ""
    className: eg

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
