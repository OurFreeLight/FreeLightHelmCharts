{{- $component := "backend" -}}
{{- $ctx := merge (dict "Component" $component) . -}}
{{- $garnetUrl := printf "redis://%s:%s" .Values.freelightAuth_backend.garnet.server (.Values.freelightAuth_backend.garnet.port | toString) -}}
{{- $garnetPubSubUrl := printf "redis://%s:%s" .Values.freelightAuth_backend.garnetPubSub.server (.Values.freelightAuth_backend.garnetPubSub.port | toString) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "freelight-auth.componentFullname" $ctx }}
  labels:
    {{- include "freelight-auth.componentSelectorLabels" $ctx | nindent 4 }}
    {{- include "freelight-auth.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "freelight-auth.componentSelectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      annotations:
        # Rolling tags push a new digest under the same tag, so helm diff
        # sees no spec change and pods never restart. Keying on
        # .Release.Revision forces a rollout on every helm upgrade.
        release/revision: {{ .Release.Revision | quote }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "freelight-auth.componentSelectorLabels" $ctx | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.imageSettings.pullSecrets }}
      imagePullSecrets:
        - name: {{ .Values.imageSettings.pullSecrets }}
      {{- end }}
      serviceAccountName: {{ include "freelight-auth.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: freelight-auth-init
          image: busybox:1.37
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Waiting for database at {{ .Values.freelightAuth_backend.database.server }}:{{ .Values.freelightAuth_backend.database.port }}"
              while ! nc -z {{ .Values.freelightAuth_backend.database.server }} {{ .Values.freelightAuth_backend.database.port }}; do
                sleep 1
              done
              echo "Database ready"
              echo "Waiting for Garnet at {{ .Values.freelightAuth_backend.garnet.server }}:{{ .Values.freelightAuth_backend.garnet.port }}"
              while ! nc -z {{ .Values.freelightAuth_backend.garnet.server }} {{ .Values.freelightAuth_backend.garnet.port }}; do
                sleep 1
              done
              echo "Garnet ready"
      containers:
        - name: freelight-auth-backend
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.freelightAuth_backend.image }}"
          imagePullPolicy: {{ .Values.imageSettings.pullPolicy }}
          ports:
            - name: http
              containerPort: 8100
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          env:
            - name: SERVER_TYPE
              value: "web-api"
            - name: LOG_LEVEL
              value: {{ .Values.freelightAuth_backend.logLevel | quote }}
            - name: HTTP_PORT
              value: "8100"
            - name: API_HTTP_PORT
              value: "8100"
            - name: BASE_URL
              value: {{ .Values.freelightAuth_backend.baseWebUrl | quote }}
            - name: BASE_API_URL
              value: {{ .Values.freelightAuth_backend.baseApiUrl | quote }}
            - name: JWT_SECRET_KEY
              value: {{ .Values.freelightAuth_backend.jwtSecretKey | quote }}
            - name: RSA_PRIVATE_KEY
              value: {{ .Values.freelightAuth_backend.rsaPrivateKey | quote }}
            - name: RSA_PUBLIC_KEY
              value: {{ .Values.freelightAuth_backend.rsaPublicKey | quote }}
            - name: DATABASE_TYPE
              value: "postgres"
            - name: DATABASE_SERVER
              value: {{ .Values.freelightAuth_backend.database.server | quote }}
            - name: DATABASE_PORT
              value: {{ .Values.freelightAuth_backend.database.port | quote }}
            - name: DATABASE_USERNAME
              value: {{ .Values.freelightAuth_backend.database.username | quote }}
            - name: DATABASE_PASSWORD
              value: {{ .Values.freelightAuth_backend.database.password | quote }}
            - name: DATABASE_SCHEMA
              value: {{ .Values.freelightAuth_backend.database.schema | quote }}
            {{- if .Values.freelightAuth_backend.database.ssl.enabled }}
            - name: DATABASE_SSL_REJECT_UNAUTHORIZED
              value: "{{ ternary "1" "0" .Values.freelightAuth_backend.database.ssl.rejectUnauthorized }}"
            - name: DATABASE_SSL_CA
              value: {{ .Values.freelightAuth_backend.database.ssl.ca | quote }}
            - name: DATABASE_SSL_KEY
              value: {{ .Values.freelightAuth_backend.database.ssl.key | quote }}
            - name: DATABASE_SSL_CERT
              value: {{ .Values.freelightAuth_backend.database.ssl.cert | quote }}
            {{- end }}
            - name: GARNET_URL
              value: {{ $garnetUrl | quote }}
            - name: GARNET_TLS
              value: "{{ ternary "1" "0" .Values.freelightAuth_backend.garnet.tls }}"
            - name: GARNET_TLS_INSECURE
              value: "{{ ternary "1" "0" .Values.freelightAuth_backend.garnet.tlsInsecure }}"
            - name: GARNET_CLUSTER
              value: "{{ ternary "1" "0" .Values.freelightAuth_backend.garnet.cluster }}"
            {{- if .Values.freelightAuth_backend.garnet.username }}
            - name: GARNET_USERNAME
              value: {{ .Values.freelightAuth_backend.garnet.username | quote }}
            {{- end }}
            {{- if .Values.freelightAuth_backend.garnet.password }}
            - name: GARNET_PASSWORD
              value: {{ .Values.freelightAuth_backend.garnet.password | quote }}
            {{- end }}
            - name: GARNET_PUBSUB_URL
              value: {{ $garnetPubSubUrl | quote }}
            - name: GARNET_PUBSUB_TLS
              value: "{{ ternary "1" "0" .Values.freelightAuth_backend.garnetPubSub.tls }}"
            - name: GARNET_PUBSUB_TLS_INSECURE
              value: "{{ ternary "1" "0" .Values.freelightAuth_backend.garnetPubSub.tlsInsecure }}"
            {{- if .Values.freelightAuth_backend.garnetPubSub.username }}
            - name: GARNET_PUBSUB_USERNAME
              value: {{ .Values.freelightAuth_backend.garnetPubSub.username | quote }}
            {{- end }}
            {{- if .Values.freelightAuth_backend.garnetPubSub.password }}
            - name: GARNET_PUBSUB_PASSWORD
              value: {{ .Values.freelightAuth_backend.garnetPubSub.password | quote }}
            {{- end }}
            {{- if .Values.freelightAuth_backend.botBlocker.enabled }}
            - name: BOTBLOCKER_URL
              value: {{ .Values.freelightAuth_backend.botBlocker.url | quote }}
            - name: BOTBLOCKER_AUTH_TOKEN
              value: {{ .Values.freelightAuth_backend.botBlocker.authToken | quote }}
            {{- end }}
            - name: AWS_SES_REGION
              value: {{ .Values.freelightAuth_backend.aws.ses.region | quote }}
            - name: AWS_ACCESS_KEY_ID
              value: {{ .Values.freelightAuth_backend.aws.ses.accessKey | quote }}
            - name: AWS_SECRET_ACCESS_KEY
              value: {{ .Values.freelightAuth_backend.aws.ses.secretKey | quote }}
            - name: OTEL_EXPORTER_TYPE
              value: {{ .Values.freelightAuth_backend.openTelemetry.type | quote }}
            - name: OTEL_EXPORTER_URL
              value: {{ .Values.freelightAuth_backend.openTelemetry.url | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.freelightAuth_backend.openTelemetry.name | quote }}
            {{- if .Values.freelightAuth_backend.openTelemetry.gcp.authKeySecretName }}
            - name: GCP_PROJECT_ID
              value: {{ .Values.freelightAuth_backend.openTelemetry.gcp.projectId | quote }}
            - name: GCP_KEY_FILEPATH
              value: "/app/gcp.json"
            {{- end }}
            {{- if .Values.freelightAuth_backend.openTelemetry.azure.connectionString }}
            - name: AZURE_APPINSIGHTS_CONNECTION_STRING
              value: {{ .Values.freelightAuth_backend.openTelemetry.azure.connectionString | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.freelightAuth_backend.openTelemetry.gcp.authKeySecretName }}
          volumeMounts:
            - name: gcp-key-volume
              mountPath: /app/gcp.json
              subPath: gcp.json
          {{- end }}
      {{- if .Values.freelightAuth_backend.openTelemetry.gcp.authKeySecretName }}
      volumes:
        - name: gcp-key-volume
          secret:
            secretName: {{ .Values.freelightAuth_backend.openTelemetry.gcp.authKeySecretName | quote }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
