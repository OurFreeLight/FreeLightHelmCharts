{{- if .Values.certManager.enabled }}
{{- $fullName := include "freelight-auth.fullname" . }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $fullName }}-tls
spec:
  secretName: {{ $fullName }}-tls
  issuerRef:
    {{- if .Values.certManager.clusterIssuer }}
    kind: ClusterIssuer
    name: {{ .Values.certManager.clusterIssuer | quote }}
    {{- else }}
    name: {{ $fullName }}-issuer
    {{- end }}
  dnsNames:
  {{- range .Values.freelightAuth.httpRoute.hostnames }}
    - {{ . | quote }}
  {{- end }}
{{- end -}}
